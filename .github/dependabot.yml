version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
    open-pull-requests-limit: 5
    # A major bump of a build or test tool is a decision, not a chore.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
